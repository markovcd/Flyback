{{- /* A fence with no language is the text language, which site.js colors; the guides write it that way. */ -}}
{{- $lang := .Type -}}
{{- if or (eq $lang "") (eq $lang "fbks") -}}
<pre><code class="fbks">{{ .Inner }}</code></pre>
{{- else -}}
<pre><code class="language-{{ $lang }}">{{ .Inner }}</code></pre>
{{- end -}}
