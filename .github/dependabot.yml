# What tells us a pinned version has moved.
#
# Every action in .github/workflows/ is pinned to a commit rather than a tag,
# which is the only pin a tag's owner cannot change under us — and which, alone,
# would mean nobody ever hears that an action has moved on. Dependabot is the
# other half of it: the pin holds, and a pull request says when it should not.
#
# The pull requests land on the Build workflow like any other change, so nothing
# is taken on the strength of the bump alone. dependabot-prs.yml rewrites the
# packages.lock.json files a NuGet one leaves stale, and squashes every NuGet,
# Docker and npm one into main once Build passes on it (ADR-0197).
#
# The Dockerfile's base images are pinned by digest in literal FROM lines, which
# the docker entry reads. A workflow or a script that runs one is moved by hand
# with it (BaseImageTests), and global.json when the SDK's feature band moves.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: []

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    labels: []

    # Version 18 pulls a StringTools that MSBuildLocator refuses (MSBL001) in
    # tools/TestOnlyMembers. Lift this when global.json's SDK carries MSBuild 18.
    ignore:
      - dependency-name: Microsoft.Build.Framework
        update-types: ["version-update:semver-major"]

    # Every package in one pull request a week: separate ones each move part of
    # the lock files and conflict with one another once the first is in.
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: []

  # The Worker's development packages, locked in worker/package-lock.json.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    labels: []
    open-pull-requests-limit: 5
