# Builds the Android editor (ADR-0184) and keeps the APK.
#
# Outside the gate on purpose: Flyback.slnx lists the project without building
# it, because the android workload, a JDK and the Android SDK are not in the gate
# image and would grow it for every push. So this is the only place the project
# is compiled in CI, and /release refuses a commit it has not passed on.
#
# It runs on GitHub's machines for every ref, `main` included: the self-hosted
# runner builds in Docker, and a workload install would leave state on it. It
# builds only; an emulator run is slow and flaky, and waits on the app reporting
# its own state over adb (TODO.md).
#
# The paths are what the APK is built from. A change to none of them starts no
# run, so /release reads that as the commit having nothing to rebuild and looks
# back for the last run on a commit that did.
#
# Every action is pinned to a commit rather than a tag; Dependabot says when a
# pin should move.

name: Android

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - global.json
      - nuget.config
      - src/Flyback.Core/**
      - src/Flyback.Engine/**
      - src/Flyback.Gpu/**
      - src/Flyback.Plugins/**
      - src/Flyback.Assist/**
      - src/Flyback.Ui/**
      - src/Flyback.Editor/**
      - src/Flyback.Editor.Android/**
      - src/Flyback.Viewer.Web/LinkedPlugins.props
      - src/plugins/**
  pull_request:
    paths:
      - .github/workflows/android.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - global.json
      - nuget.config
      - src/Flyback.Core/**
      - src/Flyback.Engine/**
      - src/Flyback.Gpu/**
      - src/Flyback.Plugins/**
      - src/Flyback.Assist/**
      - src/Flyback.Ui/**
      - src/Flyback.Editor/**
      - src/Flyback.Editor.Android/**
      - src/Flyback.Viewer.Web/LinkedPlugins.props
      - src/plugins/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A run is the workload install and one Release build; the default of six hours is what a hang costs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install the android workload
        run: dotnet workload install android

      # Never -p:RuntimeIdentifier: it flows into every referenced project and rewrites their lock files.
      - name: Build
        run: >
          dotnet build src/Flyback.Editor.Android -c Release -v minimal --nologo
          -t:Restore,Build,SignAndroidPackage
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flyback-android-apk
          path: src/Flyback.Editor.Android/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
