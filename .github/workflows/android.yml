# Builds the Android editor (ADR-0184) and keeps the APK.
#
# Outside the gate on purpose: Flyback.slnx lists the project without building
# it, because the android workload, a JDK and the Android SDK are not in the gate
# image and would grow it for every push. So this is the only place the project
# is compiled in CI, and /release refuses a commit it has not passed on.
#
# On main it runs when Build passes on a push, however late, so a red main is
# not built. The run is named for the built commit, which is how /release finds
# it: a workflow_run run belongs to the branch's tip, not the commit it built.
#
# It runs on GitHub's machines for every ref, `main` included: the self-hosted
# runner builds in Docker, and a workload install would leave state on it. It
# builds only; an emulator run is slow and flaky, and waits on the app reporting
# its own state over adb (TODO.md).
#
# Every action is pinned to a commit rather than a tag; Dependabot says when a
# pin should move.

name: Android

run-name: Android on ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On main every push runs to its verdict, in a group of its own commit, as Build
# does: /release looks for this run on the exact commit.
concurrency:
  group: android-${{ github.event.workflow_run.head_sha || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' && github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Only a push to this repository's main that passed: a fork's pull request
    # can have a branch called main too.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # A run is about two minutes; the default of six hours is what a hang costs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install the android workload
        run: dotnet workload install android

      # Never -p:RuntimeIdentifier: it flows into every referenced project and rewrites their lock files.
      - name: Build
        run: >
          dotnet build src/Flyback.Editor.Android -c Release -v minimal --nologo
          -t:Restore,Build,SignAndroidPackage
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flyback-android-apk
          path: src/Flyback.Editor.Android/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
