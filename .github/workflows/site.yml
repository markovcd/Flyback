# Builds the preset site's image and pushes it to ghcr.io/markovcd/flyback-site,
# which the NAS pulls (deploy/site/README.md). Separate from the app's Release.
#
#   push to main       -> :dev and :dev-<commit>
#   Run workflow       -> :latest and :<commit>
#
# The plugins the site starts with are signed with RELEASE_SIGNING_KEY at the
# version of the latest vX.Y.Z tag, so both channels hand out plugins a released
# Flyback installs.
#
# The actions are pinned to commits rather than tags, as in every workflow here.

name: Site

on:
  push:
    branches: [main]
    # Only what the image is built from: the server, the projects it references
    # and the plugins it starts with (PluginProject in Flyback.Server.csproj).
    # The app, the CLI, the viewer and the other plugins are in the build context
    # but not in the image, so a change to them publishes nothing. A new
    # reference or site plugin has to be added here.
    paths:
      - "src/Flyback.Server/**"
      - "src/Flyback.Engine/**"
      - "src/Flyback.Core/**"
      - "src/Flyback.Plugins/**"
      - "src/Flyback.Plugins.Figures/**"
      - "src/Flyback.Plugins.Fractals/**"
      - "site/**"
      - ".editorconfig"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: site-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Name the image
        id: tags
        run: |
          image=ghcr.io/markovcd/flyback-site
          commit="$(git rev-parse --short HEAD)"
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            printf 'tags=%s:dev,%s:dev-%s\n' "$image" "$image" "$commit" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:latest,%s:%s\n' "$image" "$image" "$commit" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        with:
          context: .
          file: src/Flyback.Server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.tags.outputs.version }}
          secret-envs: release-key=RELEASE_SIGNING_KEY
          push: true
          tags: ${{ steps.tags.outputs.tags }}
