# How much of the code the tests run, measured weekly and never judged.
#
# Not part of the gate, on purpose. Instrumentation rewrites the assemblies, and
# several tests read a built assembly's bytes and assert on what its metadata
# says — coverage.runsettings names the three it has to leave alone and says
# what that costs. It also roughly doubles what the tests take. A number nothing
# is allowed to fail on should not be charged to every push, so it is charged to
# Monday instead.
#
# The report is an artifact and a table in the run summary, both written by
# coverage.sh, which runs the same locally. There is no
# threshold and nothing here fails on the figure; it is for noticing that
# something stopped being covered.

name: Coverage

on:
  schedule:
    # Monday, early.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    # A run is about ten minutes; the default of six hours is what a hang costs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Measures into coverage/ and writes the table into the run summary.
      # coverage.sh is the whole of it, and runs the same on a developer's machine.
      - name: Measure
        run: bash coverage.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 30
