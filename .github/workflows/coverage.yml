# How much of the code the tests run, measured weekly and never judged.
#
# Not part of the gate, on purpose. Instrumentation rewrites the assemblies, and
# several tests read a built assembly's bytes and assert on what its metadata
# says — coverage.runsettings names the three it has to leave alone and says
# what that costs. It also roughly doubles what the tests take. A number nothing
# is allowed to fail on should not be charged to every push, so it is charged to
# Monday instead.
#
# The report is an artifact and a table in the run summary. There is no
# threshold and nothing here fails on the figure; it is for noticing that
# something stopped being covered.

name: Coverage

on:
  schedule:
    # Monday, early.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    # A run is about ten minutes; the default of six hours is what a hang costs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Reads the Build workflow's cache and writes none of its own, so a run
      # here never evicts what the gate depends on.
      - name: Measure
        run: |
          docker buildx build \
            --target coverage \
            --cache-from type=gha \
            --output type=local,dest=coverage \
            .

      # One report per test project, each naming every assembly that project
      # loaded, so the engine is in all of them. A line is covered if any
      # report covered it; adding the reports' totals would count it once per
      # project and call it missed wherever another project ran it.
      - name: Summarize
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, glob, re, xml.etree.ElementTree as ET

          hit = {}
          taken = {}

          for path in sorted(glob.glob("coverage/*.cobertura.xml")):
              for package in ET.parse(path).getroot().iter("package"):
                  for cls in package.iter("class"):
                      for line in cls.iter("line"):
                          key = (package.get("name"), cls.get("filename"), line.get("number"))
                          hit[key] = hit.get(key, False) or int(line.get("hits")) > 0

                          conditions = re.search(r"\((\d+)/(\d+)\)", line.get("condition-coverage") or "")
                          if conditions:
                              was = taken.get(key, (0, 0))
                              taken[key] = (max(was[0], int(conditions[1])), max(was[1], int(conditions[2])))

          lines = collections.defaultdict(lambda: [0, 0])
          branches = collections.defaultdict(lambda: [0, 0])

          for (assembly, _, _), covered in hit.items():
              lines[assembly][0] += covered
              lines[assembly][1] += 1

          for (assembly, _, _), (covered, total) in taken.items():
              branches[assembly][0] += covered
              branches[assembly][1] += total

          def rate(pair):
              return f"{pair[0] / pair[1]:.1%}" if pair[1] else "n/a"

          def row(name, line, branch):
              print(f"| {name} | {line[0]} / {line[1]} | {rate(line)} | {branch[0]} / {branch[1]} | {rate(branch)} |")

          print("| | Lines | | Branches | |")
          print("|---|---|---|---|---|")
          row("**All**",
              [sum(p[0] for p in lines.values()), sum(p[1] for p in lines.values())],
              [sum(p[0] for p in branches.values()), sum(p[1] for p in branches.values())])

          for assembly in sorted(lines, key=lambda a: -lines[a][1]):
              row(assembly, lines[assembly], branches[assembly])
          PY

          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 30
