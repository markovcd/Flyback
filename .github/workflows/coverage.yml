# How much of the code the tests run, measured weekly and never judged.
#
# Not part of the gate, on purpose. Measuring roughly doubles what the tests
# take, and a number nothing is allowed to fail on should not be charged to
# every push, so it is charged to Monday instead.
#
# The report is an artifact and a table in the run summary, both written by
# coverage.sh, which runs the same locally. There is no
# threshold and nothing here fails on the figure; it is for noticing that
# something stopped being covered.
#
# A scheduled run that fails opens an issue, or comments on the one still open,
# since nobody watches a Monday run.

name: Coverage

on:
  schedule:
    # Monday, early.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      self-hosted:
        description: Run on the self-hosted runners (main only), Linux before Windows.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  # GitHub's, or by hand on main the self-hosted runners (runner.yml).
  runner:
    uses: ./.github/workflows/runner.yml
    with:
      self-hosted: ${{ inputs.self-hosted == true }}
    secrets:
      RUNNER_STATUS_TOKEN: ${{ inputs.self-hosted && github.ref == 'refs/heads/main' && secrets.RUNNER_STATUS_TOKEN || '' }}

  measure:
    needs: runner
    outputs:
      why: ${{ steps.linux.outputs.why || steps.windows.outputs.why }}
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    # About ten minutes on a warm self-hosted cache, longer cold on GitHub's; the
    # default of six hours is what a hang costs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: runner.environment == 'github-hosted'

      # buildx drops a gha cache silently unless the cache service's address and
      # token are in the environment, and only an action's process is given them.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: runner.environment == 'github-hosted'
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN'])
              if (process.env[name]) core.exportVariable(name, process.env[name]);

      # Measures into coverage/ and writes the table into the run summary.
      # coverage.sh is the whole of it, and runs the same on a developer's machine.
      - name: Measure
        id: linux
        if: runner.os != 'Windows'
        run: bash scripts/coverage.sh

      # A bare `bash` on the Windows runner is WSL's, which cannot read the
      # runner's script paths; Git's is the one wanted.
      - name: Measure (Windows)
        id: windows
        if: runner.os == 'Windows'
        run: '& "C:/Program Files/Git/bin/bash.exe" scripts/coverage.sh'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 30

  # On GitHub's runner, and the only job that may write issues.
  tell:
    needs: measure
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHY: "${{ needs.measure.outputs.why || 'The run ended without saying why: the runner stopped or the job timed out.' }}"
        run: |
          title="The weekly coverage run failed"
          body="$(printf '%s\n\nCommit %s, run %s.' "$WHY" "$GITHUB_SHA" "$RUN")"
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
