# The gate, on every change: restore, compile, and every test in the solution.
#
# The same image the release is built from, stopped at the tests — `--target
# gate` is the Dockerfile's first stage, so what runs here is what runs before a
# release and nothing that only a release needs. It also carries the libraries
# the headless UI tests want and the ffmpeg the recording tests look for, which
# a workflow that installed a bare SDK would have to list a second time.
#
# Every action is pinned to a commit rather than a tag, because a tag is the
# action author's to move and this workflow runs on every change. Dependabot
# (.github/dependabot.yml) is what says when a pin should move.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push on top of a push leaves the older run testing a commit nobody is
# waiting on.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to main or a manual run goes to the self-hosted runner when it is
  # online, else to GitHub's. A pull request never does: the repo is public, and
  # a fork's workflow would run on that machine. The runners API needs a token
  # with repo admin, which GITHUB_TOKEN is not, hence the secret; without it the
  # job falls back to GitHub's runner.
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          runs_on='"ubuntu-latest"'
          if [ "$EVENT" != pull_request ] && [ -n "$GH_TOKEN" ]; then
            online=$(gh api repos/${{ github.repository }}/actions/runners/21               --jq '.status == "online" and (.busy | not)' || echo false)
            if [ "$online" = true ]; then
              runs_on='["self-hosted","Windows","X64"]'
            fi
          fi
          echo "runs-on=$runs_on" >> "$GITHUB_OUTPUT"

  build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    # A run is about seven minutes; the default of six hours is what a hang costs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # buildx, for the layer cache below. The runner's plain docker cannot
      # export one.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The SDK image, the apt packages and the restore are the same on almost
      # every run, and a runner keeps nothing between jobs, so without a cache
      # each is fetched cold every time. ADR-0120 took that as the price of
      # building the Dockerfile; this is the price not being paid.
      #
      # It also means a commit that changes nothing in the build context — a
      # workflow or a document, both of which .dockerignore leaves out — hits
      # the cache all the way through and runs no tests. That is the right
      # answer for such a commit, but it is the reason a green check here is
      # about the context, not about the run.
      - name: Build and test
        shell: bash
        run: |
          docker buildx build \
            --target gate \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .
