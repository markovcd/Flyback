# The gate, on every change: restore, compile, and every test in the solution,
# in the Linux image and natively on Windows (native-tests.yml). macOS runs on
# the self-hosted Mac whenever it is online, and on GitHub's only when the
# `macos` box is ticked, since its minutes cost ten times Linux's (ADR-0200);
# /release refuses a commit it has not passed on.
#
# The same image the release is built from, stopped at the tests — `--target
# gate` stops before the publishes, so what runs here is what runs before a
# release and nothing that only a release needs. It also carries the libraries
# the headless UI tests want and the ffmpeg the recording tests look for, which
# a workflow that installed a bare SDK would have to list a second time.
#
# Every action is pinned to a commit rather than a tag, because a tag is the
# action author's to move and this workflow runs on every change. Dependabot
# (.github/dependabot.yml) is what says when a pin should move.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      self-hosted:
        description: Run on the self-hosted runners (main only), Linux before Windows.
        type: boolean
        default: false
      macos:
        description: Run the native tests on macOS too, on GitHub's if the self-hosted Mac is offline.
        type: boolean
        default: false

permissions:
  contents: read

# A pull request's newer push leaves its older run testing a commit nobody is
# waiting on, so that run is cancelled. Every run on main, pushed or started by
# hand (dependabot-prs.yml starts one after each merge), runs to its verdict:
# cancelled, a break lands unseen and the next commit wears it. Its group is the
# commit, since a group keeps one pending run and drops the rest.
concurrency:
  group: build-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # GitHub's, or by hand on main the self-hosted runners (runner.yml). Either
  # self-hosted runner needs Docker with buildx. The token goes to every run on
  # main, so macOS finds the self-hosted Mac.
  runner:
    uses: ./.github/workflows/runner.yml
    with:
      self-hosted: ${{ inputs.self-hosted == true }}
    secrets:
      RUNNER_STATUS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.RUNNER_STATUS_TOKEN || '' }}

  build:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    # About seven minutes on a self-hosted runner and eleven on GitHub's; the
    # default of six hours is what a hang costs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub's runners keep nothing between jobs, so they build on a fresh
      # builder with GitHub's layer cache; a self-hosted one uses the capped
      # builder scripts/builder.sh keeps.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: runner.environment == 'github-hosted'

      # buildx drops a gha cache silently unless the cache service's address and
      # token are in the environment, and only an action's process is given them.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: runner.environment == 'github-hosted'
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN'])
              if (process.env[name]) core.exportVariable(name, process.env[name]);

      # On a self-hosted runner the layer cache makes the apt packages and the
      # restore a lookup; on GitHub's only the base and tools layers are (ADR-0120).
      #
      # On a self-hosted runner a commit that changes nothing in the build context
      # hits the cache all the way through and runs no tests. The workflows are in
      # the context, since a test reads them. A green check here is about the
      # context, not about the run.
      #
      # gate.sh writes the run's summary: the test counts and each failing test.
      - name: Build and test
        if: runner.os != 'Windows'
        run: bash scripts/gate.sh

      # A bare `bash` on the Windows runner is WSL's, which cannot read the
      # runner's script paths; Git's is the one wanted.
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: '& "C:/Program Files/Git/bin/bash.exe" scripts/gate.sh'

      # A failed run's JUnit reports and any hang or crash dump, which name the
      # test a hung host was in.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

      # The specs' Reqnroll HTML report: every scenario, passing or not.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: specs-report
          path: test-results/specs.html
          if-no-files-found: ignore
          retention-days: 14

  # What only Windows or only macOS can run, beside the Linux gate.
  native:
    needs: runner
    uses: ./.github/workflows/native-tests.yml
    with:
      machines: ${{ (inputs.macos || needs.runner.outputs.mac-online == 'true') && '["windows","macos"]' || '["windows"]' }}
      macos-runs-on: ${{ needs.runner.outputs.macos }}
