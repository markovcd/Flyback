# The gate, on every change: restore, compile, and every test in the solution.
#
# The same image the release is built from, stopped at the tests — `--target
# gate` stops before the publishes, so what runs here is what runs before a
# release and nothing that only a release needs. It also carries the libraries
# the headless UI tests want and the ffmpeg the recording tests look for, which
# a workflow that installed a bare SDK would have to list a second time.
#
# Every action is pinned to a commit rather than a tag, because a tag is the
# action author's to move and this workflow runs on every change. Dependabot
# (.github/dependabot.yml) is what says when a pin should move.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push leaves its older run testing a commit nobody is
# waiting on, so that run is cancelled. Every push to main runs to its verdict:
# cancelled, a break lands unseen and the next commit wears it. Its group is the
# commit, since a group keeps one pending run and drops the rest.
concurrency:
  group: build-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # A run on main goes to a self-hosted runner, Windows or Linux, whichever is
  # online, and waits for one. Any other ref, a pull request included, stays on
  # GitHub's: the repo is public, and a fork's workflow would run on that
  # machine. Either runner needs Docker with buildx.
  build:
    runs-on: ${{ github.ref == 'refs/heads/main' && fromJSON('["self-hosted","X64"]') || 'ubuntu-latest' }}
    # A run is about seven minutes; the default of six hours is what a hang costs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub's runners keep nothing between jobs, so they build on a fresh
      # builder with GitHub's layer cache; a self-hosted one uses the capped
      # builder scripts/builder.sh keeps.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: runner.environment == 'github-hosted'

      # The SDK image, the apt packages and the restore are the same on almost
      # every run, so the layer cache turns them into a lookup (ADR-0120).
      #
      # It also means a commit that changes nothing in the build context — a
      # workflow or a document, both of which .dockerignore leaves out — hits
      # the cache all the way through and runs no tests. That is the right
      # answer for such a commit, but it is the reason a green check here is
      # about the context, not about the run.
      #
      # gate.sh writes the run's summary: the test counts and each failing test.
      - name: Build and test
        if: runner.os != 'Windows'
        run: bash scripts/gate.sh

      # A bare `bash` on the Windows runner is WSL's, which cannot read the
      # runner's script paths; Git's is the one wanted.
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: '& "C:/Program Files/Git/bin/bash.exe" scripts/gate.sh'

      # A failed run's JUnit reports and any hang or crash dump, which name the
      # test a hung host was in.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
