# Opens an issue for a scheduled run that failed, or comments on the one of the
# same title still open, since nobody watches a scheduled run. The scheduled
# workflows call it from a job that runs only on their failure.

name: Tell

on:
  workflow_call:
    inputs:
      title:
        description: The issue's title, the same on every failure of one check.
        required: true
        type: string
      why:
        description: What failed, in a line or two.
        required: true
        type: string

permissions: {}

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ inputs.title }}
          WHY: ${{ inputs.why }}
        run: |
          body="$(printf '%s\n\nCommit %s, run %s.' "$WHY" "$GITHUB_SHA" "$RUN")"
          open="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
