# The members of src/ that only tests call, listed weekly against the baseline.
#
# A member only a test calls is a test of nothing real (engineering guide, "A
# member that only tests call"). tools/TestOnlyMembers lists them by reading
# the whole solution through Roslyn, which takes a couple of minutes and a bare
# SDK rather than the gate's image, so it runs here on a schedule and not in
# the gate. baseline.tsv beside the tool is what stands today; a row not in it
# fails the run, and a row in it that is gone is said in the summary so the
# baseline can shrink.
#
# A scheduled run that fails opens an issue, or comments on the one still open,
# since nobody watches Tuesday.

name: Test-only members

on:
  schedule:
    # Tuesday, early.
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-only-members
  cancel-in-progress: true

jobs:
  # On GitHub's runner: nothing here runs code from a pull request, and the tool
  # needs only the SDK.
  list:
    runs-on: ubuntu-latest
    # A run is about five minutes; the default of six hours is what a hang costs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: List the members only tests call
        run: |
          dotnet run --project tools/TestOnlyMembers -c Release -- Flyback.slnx test-only-members.tsv
          cut -f1-5 test-only-members.tsv | sort > found.tsv
          sort tools/TestOnlyMembers/baseline.tsv > baseline.tsv
          comm -13 baseline.tsv found.tsv > new.tsv
          comm -23 baseline.tsv found.tsv > gone.tsv
          {
            echo "## Members only tests call"
            echo
            echo "$(wc -l < found.tsv) in all, $(wc -l < new.tsv) not in the baseline, $(wc -l < gone.tsv) in the baseline and gone."
            if [ -s new.tsv ]; then echo; echo "### New"; echo; echo '```'; cat new.tsv; echo '```'; fi
            if [ -s gone.tsv ]; then echo; echo "### Gone: take these out of tools/TestOnlyMembers/baseline.tsv"; echo; echo '```'; cat gone.tsv; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s new.tsv ]; then
            echo "Members only tests call, not in the baseline:" >&2
            cat new.tsv >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-only-members
          path: test-only-members.tsv
          retention-days: 30

  # On GitHub's runner, and the only job that may write issues.
  tell:
    needs: list
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="A member only tests call is not in the baseline"
          body="$(printf 'The weekly test-only members run found a member of src/ that only tests call and the baseline does not list.\n\nCommit %s, run %s.' "$GITHUB_SHA" "$RUN")"
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
