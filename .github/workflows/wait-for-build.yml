# Waits for the Build workflow to pass on the caller's commit, and fails if it
# does not. Called by the workflows that must not run on a red main (Android,
# Worker). Build waits for a self-hosted runner, so this waits too.

name: Wait for Build

on:
  workflow_call:

permissions:
  actions: read

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for Build to pass on this commit
        run: |
          deadline=$((SECONDS + 110 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')"
            case "$run" in
              "completed success") exit 0 ;;
              "completed "*) echo "Build on $GITHUB_SHA finished: ${run#completed }." >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "Build on $GITHUB_SHA gave no verdict in 110 minutes." >&2
          exit 1
