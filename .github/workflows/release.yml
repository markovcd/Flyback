# Builds a release with release.sh, tags it, and publishes it as a GitHub
# Release: every platform zipped and a signed SHA256SUMS, which is what lets Flyback install the release as an update,
# and the Android editor as an arm64 APK signed with the same key, with a bundle for
# Google Play signed with the Play upload key once PLAY_UPLOAD_KEYSTORE is a secret.
# Everything but the APK and the publishing is release.sh, which runs the same on
# a machine with a local test key. The APK needs the android workload, which the
# gate image does not carry (ADR-0184), so it builds on GitHub's runner beside it,
# and nothing is published until both have passed (ADR-0198).
#
# Trigger from the Actions tab: Release -> Run workflow. Leave "version" blank
# to bump the minor version of the latest vX.Y.Z tag (starting at 0.1.0 if
# there is no tag yet), or type one (e.g. 1.4.0) to release that exact version.
#
# Needs the repository secret RELEASE_SIGNING_KEY: the private half of the key
# whose public half is src/Flyback.Editor/Updates/release-key.pem. See ADR-0088.
# The APK is signed with it too, under src/Flyback.Editor.Android/release-cert.pem,
# for good: Android installs an update only over an APK of the same certificate.
# See ADR-0198.
#
# The actions are pinned to commits rather than tags. This workflow is handed the
# signing key and publishes what every copy of Flyback installs as an update, so
# what it runs is not something a tag's owner gets to change.

name: Release

run-name: Release ${{ inputs.version && format('v{0}', inputs.version) || 'next minor' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4.0. Leave blank to bump the minor version automatically."
        required: false
        type: string
      self-hosted:
        description: Build on the self-hosted runners, Linux before Windows.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # GitHub's, or the self-hosted runners when asked (runner.yml).
  runner:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/runner.yml
    with:
      self-hosted: ${{ inputs.self-hosted }}
    secrets:
      RUNNER_STATUS_TOKEN: ${{ inputs.self-hosted && secrets.RUNNER_STATUS_TOKEN || '' }}

  release:
    # Only from main. release.sh runs the gate again and publishes from that same
    # build; each runner keeps a cache of its own, so on another machine from
    # ci.yml's run that gate is a rebuild and a retest. The key is the secret
    # below, held in this step's environment and never written to a file.
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    # About six minutes on a warm self-hosted cache, several times that cold on
    # GitHub's; the default of six hours is what a hang costs.
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.linux.outputs.tag || steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: runner.environment == 'github-hosted'

      # Checks the key and the changelog before building, then builds, tests,
      # packs and signs into dist/. The input reaches the script as a variable,
      # never as text spliced into it. One step per OS, because `shell` takes no
      # expression; whichever is skipped leaves its outputs empty.
      - name: Build the release
        if: runner.os != 'Windows'
        id: linux
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/release.sh "$VERSION"

      - name: Build the release (Windows)
        if: runner.os == 'Windows'
        id: version
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        # Git's bash by path: a bare bash on this runner is WSL's launcher, and the
        # runner splits the shell on spaces, hence the 8.3 name.
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: bash scripts/release.sh "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The Android editor, signed with RELEASE_SIGNING_KEY under the committed
  # certificate, beside the release job rather than after it: the key and the
  # certificate are checked before anything builds.
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A build is a few minutes; the default of six hours is what a hang costs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Android checks an update against the certificate, not only the key, so the
      # certificate is made once and committed, and has to pair with the secret.
      - name: Check the key and the certificate
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cert=src/Flyback.Editor.Android/release-cert.pem
          printf '%s\n' "$RELEASE_SIGNING_KEY" | openssl pkey -pubout -outform DER -out "$RUNNER_TEMP/derived.der"
          openssl x509 -in "$cert" -noout -pubkey | openssl pkey -pubin -outform DER -out "$RUNNER_TEMP/cert.der"
          openssl pkey -pubin -in src/Flyback.Editor/Updates/release-key.pem -outform DER -out "$RUNNER_TEMP/committed.der"
          if ! cmp -s "$RUNNER_TEMP/derived.der" "$RUNNER_TEMP/cert.der" || ! cmp -s "$RUNNER_TEMP/cert.der" "$RUNNER_TEMP/committed.der"; then
            echo "release: $cert, RELEASE_SIGNING_KEY and release-key.pem are not one key" >&2
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the android workload
        run: dotnet workload install android

      # The version as release.sh works it out, from the same input and tags. The
      # keystore lives for this step only, outside the workspace, under a password
      # made for it.
      # Never -p:RuntimeIdentifier: it flows into every referenced project and rewrites their lock files.
      - name: Build the APK
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          . scripts/release-version.sh "$VERSION"
          keystore="$RUNNER_TEMP/flyback.p12"
          trap 'rm -f "$keystore"' EXIT
          ANDROID_KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          export ANDROID_KEYSTORE_PASSWORD
          openssl pkcs12 -export -name flyback -in src/Flyback.Editor.Android/release-cert.pem \
            -inkey <(printf '%s\n' "$RELEASE_SIGNING_KEY") -out "$keystore" -passout env:ANDROID_KEYSTORE_PASSWORD
          dotnet build src/Flyback.Editor.Android -c Release -v minimal --nologo \
            -t:Restore,Build,SignAndroidPackage \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true \
            -p:FlybackAndroidRuntimes=android-arm64 \
            -p:ApplicationDisplayVersion="$version" -p:ApplicationVersion="$version_code" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$keystore" \
            -p:AndroidSigningKeyAlias=flyback \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD
          mkdir -p apk
          cp src/Flyback.Editor.Android/bin/Release/net10.0-android/*-Signed.apk "apk/flyback-${version}-android-arm64.apk"

      # Signed under the committed certificate and nothing else, and not debuggable.
      - name: Check the APK
        run: |
          apk=$(ls apk/*.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          expected=$(openssl x509 -in src/Flyback.Editor.Android/release-cert.pem -outform DER | sha256sum | cut -d' ' -f1)
          signers=$(grep -c 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt")
          if [ "$signers" != 1 ] || ! grep -q "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/certs.txt"; then
            echo "release: $apk is not signed under release-cert.pem alone" >&2
            exit 1
          fi
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          if "$aapt2" dump badging "$apk" | grep -q application-debuggable; then
            echo "release: $apk is debuggable" >&2
            exit 1
          fi
          ls -l "$apk"

      # The bundle Google Play takes, signed with the RSA upload key Play holds on file:
      # Play rejects an EC key, and re-signs the bundle with its own app signing key.
      # Skipped, not failed, until the upload keystore is a secret.
      - name: Build the Play bundle
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE" ] || [ -z "$PLAY_UPLOAD_PASSWORD" ]; then
            echo "::notice::No PLAY_UPLOAD_KEYSTORE secret, so no Play bundle"
            exit 0
          fi
          . scripts/release-version.sh "$VERSION"
          keystore="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$keystore"
          dotnet build src/Flyback.Editor.Android -c Release -v minimal --nologo \
            -t:Build,SignAndroidPackage \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true \
            -p:FlybackAndroidRuntimes=android-arm64 -p:AndroidPackageFormat=aab \
            -p:ApplicationDisplayVersion="$version" -p:ApplicationVersion="$version_code" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$keystore" \
            -p:AndroidSigningKeyAlias=upload \
            -p:AndroidSigningStorePass=env:PLAY_UPLOAD_PASSWORD \
            -p:AndroidSigningKeyPass=env:PLAY_UPLOAD_PASSWORD
          cp src/Flyback.Editor.Android/bin/Release/net10.0-android/*-Signed.aab "apk/flyback-${version}-android-play.aab"
          ls -l apk/*.aab

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: apk/
          if-no-files-found: error
          retention-days: 7

  # Tags and publishes, only once the release and the APK have both built.
  publish:
    needs: [release, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          body_path: dist/RELEASE_NOTES.md

  # install.sh against the release just published, as a visitor runs it: the
  # download, the SHA256SUMS, the signature against the key in the script and the
  # unzip. On GitHub's runner, a clean Linux machine. A failure here is a release
  # already up that does not install.
  install:
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the release and remove it
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          export FLYBACK_VERSION="${TAG#v}" FLYBACK_DIR="$RUNNER_TEMP/flyback"
          bash install.sh --no-links
          test -x "$FLYBACK_DIR/Flyback"
          bash install.sh --uninstall

  # The Microsoft Store's package of the release just published, installed and checked on
  # a clean Windows machine, then attached to the release for Partner Center (ADR-0199).
  store:
    needs: [release, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/store.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
