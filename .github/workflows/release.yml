# Builds a release with release.sh, tags it, and publishes it as a GitHub
# Release: every platform zipped and a signed SHA256SUMS, which is what lets Flyback install the release as an update.
# Once the release is out, the preset site's image is pushed to
# ghcr.io/markovcd/flyback-site as the version and as latest, which is what the
# NAS pulls (deploy/site/README.md).
# Everything but the publishing is release.sh, which runs the same on a machine
# with a local test key.
#
# Trigger from the Actions tab: Release -> Run workflow. Leave "version" blank
# to bump the minor version of the latest vX.Y.Z tag (starting at 0.1.0 if
# there is no tag yet), or type one (e.g. 1.4.0) to release that exact version.
#
# Needs the repository secret RELEASE_SIGNING_KEY: the private half of the key
# whose public half is src/Flyback.App/Updates/release-key.pem. See ADR-0088.
#
# The actions are pinned to commits rather than tags. This workflow is handed the
# signing key and publishes what every copy of Flyback installs as an update, so
# what it runs is not something a tag's owner gets to change.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4.0. Leave blank to bump the minor version automatically."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Checks the key and the changelog before building, then builds, tests,
      # packs and signs into dist/. The input reaches the script as a variable,
      # never as text spliced into it.
      - name: Build the release
        id: version
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        run: bash release.sh "$VERSION"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true

  # The site's image for both processors a NAS has. The build runs natively and
  # only the runtime layer is per platform, so there is no emulation to set up.
  site:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        with:
          context: .
          file: src/Flyback.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.release.outputs.version }}
          secret-envs: release-key=RELEASE_SIGNING_KEY
          push: true
          tags: |
            ghcr.io/markovcd/flyback-site:${{ needs.release.outputs.version }}
            ghcr.io/markovcd/flyback-site:latest
