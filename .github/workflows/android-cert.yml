# Makes the certificate the Android APK is signed under (ADR-0198) from
# RELEASE_SIGNING_KEY, once, and uploads it as the release-cert artifact to be
# committed as src/Flyback.Editor.Android/release-cert.pem. The key lives only in
# the secret, so this is the one place the certificate can be made without a
# Release run. It runs when this file lands on main and is deleted by the commit
# that adds the certificate.

name: Android certificate

on:
  push:
    branches: [main]
    paths: [.github/workflows/android-cert.yml]

permissions:
  contents: read

jobs:
  make:
    if: github.repository == 'markovcd/Flyback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The certificate holds only the public key; it is checked against
      # release-key.pem before it is uploaded.
      - name: Make the certificate
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p cert
          printf '%s\n' "$RELEASE_SIGNING_KEY" | openssl req -new -x509 -key /dev/stdin \
            -subj "/CN=Flyback" -days 36500 -out cert/release-cert.pem
          cmp <(openssl x509 -in cert/release-cert.pem -noout -pubkey | openssl pkey -pubin -outform DER) \
              <(openssl pkey -pubin -in src/Flyback.Editor/Updates/release-key.pem -outform DER)
          openssl x509 -in cert/release-cert.pem -noout -subject -enddate -fingerprint -sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cert
          path: cert/release-cert.pem
          if-no-files-found: error
