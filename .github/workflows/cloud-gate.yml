# The whole gate on GitHub's machines, by hand: the Linux gate, the solution's
# tests natively on Windows and macOS, and the Android editor on an emulator.
#
# The gate runs in a Linux image, so the tests only Windows can run (the registry,
# WASAPI, DPAPI, Direct3D, WinIO) or only macOS can (CoreAudio, CoreMIDI, the
# Keychain) run nowhere else, and the APK is built but never started. Each native
# machine is given what the gate's image carries and it lacks: ffmpeg, the Chrome
# it has off PATH, and on Windows Mesa's software OpenGL beside the test hosts.
# FLYBACK_GATE stays unset there, so what is still missing skips its test and the
# summary's skip table names it: JACK and ALSA are Linux's, and macOS has no
# headless OpenGL. docs/handoff/tests-on-github-hosted-runners.md is the plan this
# serves.
#
# Every action is pinned to a commit rather than a tag; Dependabot says when a
# pin should move.

name: Cloud gate

run-name: Cloud gate on ${{ inputs.os }}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Which machines to run on.
        type: choice
        options: [all, linux, windows, macos, android]
        default: all

permissions:
  contents: read

jobs:
  # gate.sh on a fresh builder with GitHub's layer cache, as ci.yml runs it there.
  linux:
    if: inputs.os == 'all' || inputs.os == 'linux'
    runs-on: ubuntu-latest
    # About eleven minutes cold; the default of six hours is what a hang costs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and test
        run: bash scripts/gate.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  native:
    if: inputs.os == 'all' || inputs.os == 'windows' || inputs.os == 'macos'
    strategy:
      # One machine's failure says nothing about the other's.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["windows","macos"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}-latest
    # Restore, build and the suite, cold; the default of six hours is what a hang costs.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # The summary writes non-ASCII; Windows' default code page would refuse it.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # Chrome is on both images, under a path the specs do not search.
      - name: Point the specs at Chrome
        run: |
          case "$RUNNER_OS" in
            Windows) chrome='C:\Program Files\Google\Chrome\Application\chrome.exe' ;;
            macOS) chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ;;
          esac
          echo "FLYBACK_CHROMIUM=$chrome" >> "$GITHUB_ENV"

      # Locked and Release, as the gate builds.
      - name: Restore and build
        run: |
          dotnet restore Flyback.slnx --locked-mode
          dotnet build Flyback.slnx -c Release --no-restore

      # The runner has no GPU and Windows' own OpenGL stops at 1.1. Mesa's llvmpipe,
      # pinned by version and hash, beside each test host: an application's folder
      # is searched for opengl32.dll before System32.
      - name: Put Mesa's software OpenGL beside the test hosts (Windows)
        if: runner.os == 'Windows'
        env:
          MESA: "26.2.4"
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mesa.7z" "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA/mesa3d-$MESA-release-msvc.7z"
          echo "$MESA_SHA256  $RUNNER_TEMP/mesa.7z" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa.7z" > /dev/null
          for host in tests/*/bin/Release/*/; do
            for dll in opengl32.dll libgallium_wgl.dll libglapi.dll; do
              [ -f "$RUNNER_TEMP/mesa/x64/$dll" ] && cp "$RUNNER_TEMP/mesa/x64/$dll" "$host"
            done
          done
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"

      # The run never fails this step, so the summary is written from a failing one.
      # No test host takes ten minutes, so one that has finished nothing for ten has hung.
      - name: Test
        run: |
          mkdir -p test-results
          set +e
          dotnet test --solution Flyback.slnx -c Release --no-build \
            --hangdump --hangdump-timeout 10m --hangdump-type Mini \
            --report-xunit-junit --results-directory test-results
          echo $? > test-results/exit-code

      # Python is python3 on macOS and python on Windows.
      - name: Summarize
        run: |
          python3 -c '' 2>/dev/null || python3() { python "$@"; }
          python3 scripts/test-summary.py > test-results/summary.md
          cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.os }}-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on a failed run
        run: exit "$(cat test-results/exit-code)"

  # The APK on an x86_64 emulator, started, timed and turned sideways by
  # android-smoke.sh. GitHub's Linux runners give a container KVM once its device
  # is opened to the runner's user.
  android:
    if: inputs.os == 'all' || inputs.os == 'android'
    runs-on: ubuntu-latest
    # The workload, the system image, the boot and the build; the default of six hours is what a hang costs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install the android workload
        run: dotnet workload install android

      - name: Open KVM to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the editor on an emulator and ask it how it is doing
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/android-smoke.sh
