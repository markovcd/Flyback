# Publishes the website in site/ to GitHub Pages, as it stands on main, with the
# web viewer (ADR-0160) built into it at viewer/.
#
# The site itself is plain HTML, CSS and a little script, uploaded as it is. The
# viewer is compiled ahead of time to WebAssembly here, in the SDK image, as the
# preset site's image compiles it, so no build of it is ever committed. Pages
# must be set to deploy from GitHub Actions (Settings -> Pages -> Source) before
# the first run can publish.
#
# The actions are pinned to commits rather than tags, as in every workflow here.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The workload and the Python its Emscripten runs on, as in the site's Dockerfile.
      - name: Build the web viewer
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo mcr.microsoft.com/dotnet/sdk:10.0 bash -euc '
            apt-get update
            apt-get install --yes --no-install-recommends python3
            dotnet workload install wasm-tools
            dotnet publish src/Flyback.Web -c Release -p:RunAOTCompilation=true -p:CompressionEnabled=false -o out/web
          '
          cp -r out/web/wwwroot/viewer site/viewer

      # The presets page lists what the viewer offers, as the viewer itself says it.
      - name: List the viewer's presets
        run: node out/web/hear.mjs --presets > site/viewer/presets.json

      # The site links the preset site's pages as neighbors, which they are on
      # the preset site itself. Here they are elsewhere, at vars.PRESETS_URL.
      - name: Point the preset site's pages at its address
        if: vars.PRESETS_URL != ''
        env:
          PRESETS_URL: ${{ vars.PRESETS_URL }}
        run: |
          base="${PRESETS_URL%/}"
          for page in src/Flyback.Server/wwwroot/*.html; do
            name="$(basename "$page")"
            find site -name '*.html' -exec sed -i -E "s#href=\"(\.\./)?$name#href=\"$base/$name#g" {} +
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
