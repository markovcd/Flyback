# Publishes the page that sends GitHub Pages' visitors to the website on the preset
# site's Worker (deploy/pages/redirect.html), as index.html and as 404.html, so any
# path under /Flyback/ goes to the same path there. Pages cannot send an HTTP
# redirect, and shipped editors still open this address, so the stub stays.
# Pages must be set to deploy from GitHub Actions (Settings -> Pages -> Source).
#
# The actions are pinned to commits rather than tags, as in every workflow here.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "deploy/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Make the pages
        run: |
          mkdir -p artifacts/pages
          cp deploy/pages/redirect.html artifacts/pages/index.html
          cp deploy/pages/redirect.html artifacts/pages/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/pages

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
