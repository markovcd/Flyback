# Publishes the website in site/ to GitHub Pages, as it stands on main, with the
# web viewer (ADR-0160) and the web editor built into it.
#
# pages.sh does the building, so a run here and a run on a desk give the same folder.
# It runs in the SDK image, as the preset site's image builds the viewer, so no build
# of it is ever committed. Pages must be set to deploy from GitHub Actions
# (Settings -> Pages -> Source) before the first run can publish.
#
# The actions are pinned to commits rather than tags, as in every workflow here.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - "stills.sh"
      - "pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The workload and the Python its Emscripten runs on, as in the site's Dockerfile.
      - name: Build the site as Pages serves it
        env:
          PRESETS_URL: ${{ vars.PRESETS_URL }}
        run: |
          docker run --rm -e PRESETS_URL -v "$PWD:/repo" -w /repo mcr.microsoft.com/dotnet/sdk:10.0 bash -euc '
            apt-get update
            apt-get install --yes --no-install-recommends python3
            dotnet workload install wasm-tools
            ./pages.sh artifacts/pages
          '

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/pages

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
