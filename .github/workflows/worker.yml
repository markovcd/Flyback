# Deploys the preset site's Worker (worker/) with the pages, the viewer and the
# editor, puts the framework files too large to be assets in R2, then gives the site
# the presets and plugins it starts with and says again what the web pages lack for
# every preset (deploy/cloudflare/README.md). Runs on a
# push to main that touches what the site is built from, and by hand.
#
# Off until the repository variable WORKER_ENVIRONMENT names the wrangler environment
# to deploy, so nothing reaches Cloudflare before it is set up. The plugins the site
# starts with are signed with RELEASE_SIGNING_KEY at the version of the latest vX.Y.Z
# tag, so they install on a released Flyback.

name: Worker

on:
  push:
    branches: [main]
    # What the Worker, the pages, the viewer, the editor, the stills and the defaults
    # are built from. A new project they reference is added here.
    paths:
      - "worker/**"
      - "site/**"
      - "src/Flyback.Server/wwwroot/**"
      - "src/Flyback.Server/Defaults/**"
      - "src/Flyback.Server/Flyback.Server.csproj"
      - "src/Flyback.Site/**"
      - "src/Flyback.Viewer.Web/**"
      - "src/Flyback.Editor.Web/**"
      - "src/Flyback.Editor/**"
      - "src/Flyback.Editor.Desktop/**"
      - "src/Flyback.Cli/**"
      - "src/Flyback.Ui/**"
      - "src/Flyback.Gpu/**"
      - "src/Flyback.Assist/**"
      - "src/Flyback.Engine/**"
      - "src/Flyback.Core/**"
      - "src/Flyback.Plugins/**"
      - "src/plugins/**"
      - ".editorconfig"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - "scripts/stills.sh"
      - "Dockerfile"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# A deploy finishes what it started, as Pages does.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.WORKER_ENVIRONMENT != ''
    runs-on: ubuntu-latest
    # The ahead-of-time viewer and editor are most of a run of about twenty minutes.
    timeout-minutes: 90
    env:
      WORKER_ENVIRONMENT: ${{ vars.WORKER_ENVIRONMENT }}
      PRESET_SITE_URL: ${{ vars.PRESET_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Name the version
        id: version
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the pages, flyback-site and the defaults
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          docker buildx build --target site-assets --build-arg VERSION="$VERSION"
          --secret id=release-key,env=RELEASE_SIGNING_KEY --output type=local,dest=out .

      - name: Migrate the database and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf worker/public
          cp -r out/public worker/public
          docker run --rm -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID -e WORKER_ENVIRONMENT -e CI=true -e WRANGLER_SEND_METRICS=false \
            -v "$PWD/worker":/w -w /w node:24-bookworm-slim \
            sh -c 'npm ci --no-audit --no-fund && npx wrangler d1 migrations apply DB --remote --env "$WORKER_ENVIRONMENT" && npx wrangler deploy --env "$WORKER_ENVIRONMENT"'

      # A hostname the deploy has just taken takes a minute to resolve.
      - name: Wait for the site to answer
        run: |
          for _ in $(seq 30); do
            curl -fsS -m 10 -o /dev/null "${PRESET_SITE_URL%/}/api/v1/presets" && exit 0
            sleep 10
          done
          echo "${PRESET_SITE_URL} did not answer in five minutes." >&2
          exit 1

      # A framework file past the 25 MiB a static asset may be is served from R2 on the same path.
      - name: Put the framework files too large to be assets in R2
        env:
          FLYBACK_ACCESS_ID: ${{ secrets.FLYBACK_ACCESS_ID }}
          FLYBACK_ACCESS_SECRET: ${{ secrets.FLYBACK_ACCESS_SECRET }}
        run: |
          (cd out/large && find . -type f | sed 's|^\./||') | while read -r path; do
            curl -fsS --max-time 600 -X PUT --data-binary "@out/large/$path" \
              -H "CF-Access-Client-Id: $FLYBACK_ACCESS_ID" -H "CF-Access-Client-Secret: $FLYBACK_ACCESS_SECRET" \
              "${PRESET_SITE_URL%/}/api/v1/admin/assets/$path"
            echo "$path"
          done

      - name: Give the site its defaults and say what the pages lack
        env:
          FLYBACK_ACCESS_ID: ${{ secrets.FLYBACK_ACCESS_ID }}
          FLYBACK_ACCESS_SECRET: ${{ secrets.FLYBACK_ACCESS_SECRET }}
        run: |
          docker run --rm -e PRESET_SITE_URL -e FLYBACK_ACCESS_ID -e FLYBACK_ACCESS_SECRET -v "$PWD/out":/out mcr.microsoft.com/dotnet/runtime:10.0 \
            sh -c 'dotnet /out/flyback-site/flyback-site.dll push-defaults --server "$PRESET_SITE_URL" /out/defaults/* \
              && dotnet /out/flyback-site/flyback-site.dll validate-submissions --server "$PRESET_SITE_URL" --lacks'
