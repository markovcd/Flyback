# Deploys the preset site's Worker (worker/) with the pages, the viewer and the
# editor, puts the framework files too large to be assets in R2, then gives the site
# the presets and plugins it starts with and says again what the web pages lack for
# every preset (deploy/cloudflare/README.md). Runs when Build passes on a push to
# main that touches what the site is built from, however late Build finishes, and
# by hand.
#
# A workflow_run takes no paths filter, so the first job reads the pushed range
# against the list itself, and the deploy is skipped rather than started and
# stopped: a started one would take the queue's one pending place from a deploy
# that matters.
#
# Off until the repository variable WORKER_ENVIRONMENT names the wrangler environment
# to deploy, so nothing reaches Cloudflare before it is set up. The plugins the site
# starts with are signed with RELEASE_SIGNING_KEY at the version of the latest vX.Y.Z
# tag, so they install on a released Flyback.

name: Worker

run-name: Worker on ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether the pushed range touches what the site is built from. Only a push to
  # this repository's main, or a Build started on it by hand, that passed: a
  # fork's pull request can have a branch called main too. The range starts at the commit the Build before this one
  # built, since every push to main gets a Build of its own.
  changes:
    if: >-
      vars.WORKER_ENVIRONMENT != '' && github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      touched: ${{ steps.range.outputs.touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the pushed range against what the site is built from
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --limit 100 \
            --json databaseId,headSha --jq "map(select(.databaseId < $RUN))[0].headSha // empty")"
          # No earlier Build, or one off this line: deploy rather than guess.
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$BUILT"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          touched=false
          while read -r file; do
            # What the Worker, the pages, the viewer, the editor, the stills and the
            # defaults are built from. A new project they reference is added here.
            case "$file" in
              worker/* | site/* | src/Flyback.Site/* | src/Flyback.Site.Client/* \
              | src/Flyback.Viewer.Web/* | src/Flyback.Editor.Web/* | src/Flyback.Editor/* \
              | src/Flyback.Editor.Desktop/* | src/Flyback.Cli/* | src/Flyback.Ui/* \
              | src/Flyback.Host/* | src/Flyback.Gpu/* | src/Flyback.Assist/* \
              | src/Flyback.Engine/* | src/Flyback.Core/* | src/Flyback.Plugins/* | src/plugins/* \
              | .editorconfig | Directory.Build.props | Directory.Build.targets \
              | Directory.Packages.props | global.json | scripts/stills.sh | Dockerfile \
              | .github/workflows/worker.yml)
                touched=true
                echo "$file"
                ;;
            esac
          done < <(git diff --name-only "$base" "$BUILT")
          echo "touched=$touched" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    # By hand there is nothing to wait for; after Build, only a range that touched the site.
    if: >-
      ${{ !cancelled() && vars.WORKER_ENVIRONMENT != '' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.touched == 'true') }}
    # A deploy finishes what it started, as Pages does.
    concurrency:
      group: worker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The ahead-of-time viewer and editor are most of a run of about twenty minutes,
    # and a run that changed none of src/ takes them from the layer cache.
    timeout-minutes: 90
    env:
      WORKER_ENVIRONMENT: ${{ vars.WORKER_ENVIRONMENT }}
      PRESET_SITE_URL: ${{ vars.PRESET_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Name the version
        id: version
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # buildx drops a gha cache silently unless the cache service's address and
      # token are in the environment, and only an action's process is given them.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN'])
              if (process.env[name]) core.exportVariable(name, process.env[name]);

      # The site's own scope in GitHub's layer cache; the gate reads its base and
      # tools layers from it.
      - name: Build the pages, flyback-site and the defaults
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          docker buildx build --target site-assets --build-arg VERSION="$VERSION"
          --cache-from type=gha,scope=site
          --cache-to type=gha,scope=site,mode=max
          --secret id=release-key,env=RELEASE_SIGNING_KEY --output type=local,dest=out .

      - name: Migrate the database and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf worker/public
          cp -r out/public worker/public
          docker run --rm -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID -e WORKER_ENVIRONMENT -e CI=true -e WRANGLER_SEND_METRICS=false \
            -v "$PWD/worker":/w -w /w node:26.11.1-bookworm-slim@sha256:86f07bc9c5dce4578cf37e5a418b7bfc7f817cda25cde66e2b66e95ed86c4567 \
            sh -c 'npm ci --no-audit --no-fund && npx wrangler d1 migrations apply DB --remote --env "$WORKER_ENVIRONMENT" && npx wrangler deploy --env "$WORKER_ENVIRONMENT"'

      # A hostname the deploy has just taken takes a minute to resolve.
      - name: Wait for the site to answer
        run: |
          for _ in $(seq 30); do
            curl -fsS -m 10 -o /dev/null "${PRESET_SITE_URL%/}/api/v1/presets" && exit 0
            sleep 10
          done
          echo "${PRESET_SITE_URL} did not answer in five minutes." >&2
          exit 1

      # A framework file past the 25 MiB a static asset may be is served from R2 on the same path.
      - name: Put the framework files too large to be assets in R2
        env:
          FLYBACK_ACCESS_ID: ${{ secrets.FLYBACK_ACCESS_ID }}
          FLYBACK_ACCESS_SECRET: ${{ secrets.FLYBACK_ACCESS_SECRET }}
        run: |
          (cd out/large && find . -type f | sed 's|^\./||') | while read -r path; do
            curl -fsS --max-time 600 -X PUT --data-binary "@out/large/$path" \
              -H "CF-Access-Client-Id: $FLYBACK_ACCESS_ID" -H "CF-Access-Client-Secret: $FLYBACK_ACCESS_SECRET" \
              "${PRESET_SITE_URL%/}/api/v1/admin/assets/$path"
            echo "$path"
          done

      # The gate's SDK image rather than a runtime image, so one pin covers both.
      - name: Give the site its defaults and say what the pages lack
        env:
          FLYBACK_ACCESS_ID: ${{ secrets.FLYBACK_ACCESS_ID }}
          FLYBACK_ACCESS_SECRET: ${{ secrets.FLYBACK_ACCESS_SECRET }}
        run: |
          docker run --rm -e PRESET_SITE_URL -e FLYBACK_ACCESS_ID -e FLYBACK_ACCESS_SECRET -v "$PWD/out":/out \
            mcr.microsoft.com/dotnet/sdk:10.0.402@sha256:747cbade5bfd918a175ac32f8f1d931edec2c7d0d5397a3de72eaef1ac1f66d2 \
            sh -c 'dotnet /out/flyback-site/flyback-site.dll push-defaults --server "$PRESET_SITE_URL" /out/defaults/* \
              && dotnet /out/flyback-site/flyback-site.dll validate-submissions --server "$PRESET_SITE_URL" --lacks'
