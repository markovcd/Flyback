<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flyback Viewer</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <a class="brand" href="../">Flyback</a>
    <a id="back" class="back" hidden></a>
    <button id="presets" class="picker" aria-haspopup="dialog" disabled>Presets</button>
    <label class="file" hidden>Open file<input id="file" type="file" accept=".fbk,.fbkb,.fbks"></label>
    <select id="size" aria-label="Resolution"></select>
  </header>
  <dialog id="gallery" aria-label="Presets">
    <div class="gallery-head">
      <strong>Start from a preset</strong>
      <button id="gallery-close" aria-label="Close">✕</button>
    </div>
    <input id="gallery-filter" type="search" placeholder="Filter presets" aria-label="Filter presets">
    <div id="gallery-tiles"></div>
  </dialog>
  <main>
    <canvas id="screen"></canvas>
    <div id="cover">Loading…</div>
  </main>
  <nav class="transport" aria-label="Transport">
    <button id="play" disabled aria-label="Play" title="Play (Space)">▶</button>
    <button id="rewind" disabled aria-label="Rewind" title="Rewind (Home)">⏮</button>
    <input id="seek" type="range" min="0" max="1" step="any" value="0" disabled aria-label="Position">
    <span id="clock">0:00 / 0:00</span>
    <button id="mute" disabled aria-label="Mute" title="Mute (M)">🔊</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" title="Volume (Up and Down)">
    <button id="fullscreen" aria-label="Full screen" title="Full screen (F)">⛶</button>
  </nav>
  <section id="panel" aria-label="Panel" hidden></section>
  <p id="about" hidden></p>
  <footer id="status"></footer>
  <script type="module" src="main.js"></script>
</body>
</html>
