<!DOCTYPE html>
<html lang="en" data-preset-site="../">
<head>
  <meta charset="utf-8">
  <!-- A phone's keyboard shrinks the page rather than covering the field being typed into. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Flyback</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <!-- Added to a phone's home screen, the editor opens with no browser bars at all. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#16181B">
  <style>
    html, body, #out { margin: 0; height: 100%; background: #16181B; overflow: hidden; }
    /* The visible height, so a phone browser's address bar never covers the transport and status bars. */
    html, body { height: 100dvh; }
    /* Every finger is the editor's: no page pinch, scroll or pull-to-refresh. */
    html, body, #out { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    /* Avalonia types through a hidden input; below 16px an iPhone zooms in on it, and no pinch gets back out. */
    .avalonia-input-element { font-size: 16px; }
    /* Shown over the empty page until the editor has drawn; main.js fills the bar and takes it away. */
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
               background: #16181B; color: #8A909A; font: 13px/1.5 Inter, system-ui, sans-serif; transition: opacity 0.2s; }
    /* The banner covers the page, but never so wide that its middle, the mark and the name, is cut. */
    #loading .art { width: min(max(100vw, 177.78dvh), 190vw); flex: none; aspect-ratio: 16 / 9;
                    -webkit-mask-image: linear-gradient(transparent, #000 8%, #000 92%, transparent);
                    mask-image: linear-gradient(transparent, #000 8%, #000 92%, transparent); }
    #loading .status { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); max-width: calc(100vw - 48px);
                       display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 20px;
                       border-radius: 10px; background: color-mix(in srgb, #16181B 90%, transparent); text-align: center; }
    #loading .said:empty { display: none; }
    #loading .bar { width: 200px; height: 3px; border-radius: 2px; background: #2A2D34; overflow: hidden; }
    #loading .fill { width: 0; height: 100%; background: #77EA9A; transition: width 0.15s; }
    #loading.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="out"></div>
  <div id="loading" role="status">
    <img class="art" src="../assets/splash.jpg" alt="">
    <div class="status">
      <div class="bar"><div class="fill"></div></div>
      <div class="said"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
