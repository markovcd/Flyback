<!DOCTYPE html>
<html lang="en" data-preset-site="../">
<head>
  <meta charset="utf-8">
  <!-- A phone's keyboard shrinks the page rather than covering the field being typed into. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Flyback</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <!-- Added to a phone's home screen, the editor opens with no browser bars at all. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#16181c">
  <style>
    html, body, #out { margin: 0; height: 100%; background: #16181c; overflow: hidden; }
    /* The visible height, so a phone browser's address bar never covers the transport and status bars. */
    html, body { height: 100dvh; }
    /* Every finger is the editor's: no page pinch, scroll or pull-to-refresh. */
    html, body, #out { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    /* Avalonia types through a hidden input; below 16px an iPhone zooms in on it, and no pinch gets back out. */
    .avalonia-input-element { font-size: 16px; }
    /* Shown over the empty page until the editor has drawn; main.js fills the bar and takes it away. */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 20px; background: #16181c; color: #9a9ca3; font: 13px/1.5 Inter, system-ui, sans-serif; transition: opacity 0.2s; }
    #loading img { width: 96px; height: 96px; }
    #loading .bar { width: 200px; height: 3px; border-radius: 2px; background: #2a2d33; overflow: hidden; }
    #loading .fill { width: 0; height: 100%; background: #4c8dff; transition: width 0.15s; }
    #loading.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="out"></div>
  <div id="loading" role="status">
    <img src="../assets/logo.svg" alt="">
    <div class="bar"><div class="fill"></div></div>
    <div class="said">Loading Flyback</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
