# The site on the NAS, one Docker project per channel. See README.md beside this file.
#
# For the dev project, set TAG=dev and NAME=flyback-dev in a .env beside this
# file, or write them into the lines below.
#
# No port is published: the tunnel or proxy reaches the site over a Docker
# network they share, and nothing else can.
services:
  flyback:
    image: ghcr.io/markovcd/flyback-site:${TAG:-latest}
    # What a tunnel on the same Docker network reaches the site by, as http://flyback:8080.
    container_name: ${NAME:-flyback}
    restart: unless-stopped
    # A ceiling, so a flood of uploads takes down the site rather than the NAS.
    mem_limit: 1g
    environment:
      # The admin at /admin.html, who can rename, unpublish and delete presets. Blank turns admin mode off.
      Site__Admin__User: ""
      Site__Admin__Password: ""
    volumes:
      # The database, which only this container writes.
      - ./data:/data
      # The shared folder flyback-cli render-presets writes into; the site only reads it.
      - ./media:/media:ro
