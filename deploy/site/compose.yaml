# The site on the NAS, one Docker project per channel. See README.md beside this file.
#
# For the dev project, set TAG=dev and PORT=8081 in a .env beside this file, or
# write them into the two lines below.
services:
  presets:
    image: ghcr.io/markovcd/flyback-site:${TAG:-latest}
    restart: unless-stopped
    ports:
      # The NAS's port, then the site's own, which is always 8080.
      - "${PORT:-8080}:8080"
    environment:
      # The admin at /admin.html, who can rename, unpublish and delete presets. Blank turns admin mode off.
      Site__Admin__User: ""
      Site__Admin__Password: ""
    volumes:
      # The database, which only this container writes.
      - ./data:/data
      # The shared folder flyback-cli render-presets writes into; the site only reads it.
      - ./media:/media:ro
